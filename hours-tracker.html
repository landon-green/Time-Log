<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TIMECARD — Hours Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --surface3: #1c1c28;
      --border: #242432;
      --accent: #6366f1;
      --accent2: #22d3ee;
      --green: #4ade80;
      --warn: #fb923c;
      --danger: #f43f5e;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #475569;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Top bar ── */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 28px; height: 56px; background: var(--surface);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: 2px; color: var(--accent); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    #sync-pill {
      display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono);
      color: var(--text2); background: var(--surface2); padding: 5px 12px;
      border-radius: 20px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
    }
    #sync-pill:hover { border-color: var(--accent); color: var(--accent); }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
    .sync-dot.synced { background: var(--green); }
    .sync-dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
    .sync-dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

    /* ── Nav tabs ── */
    .nav { display: flex; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .nav-btn {
      padding: 14px 20px; font-size: 13px; font-weight: 500; font-family: var(--sans);
      border: none; background: transparent; color: var(--text2); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; letter-spacing: 0.3px;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .tab { display: none; padding: 28px; max-width: 1100px; margin: 0 auto; }
    .tab.active { display: block; }

    /* ── Cards & panels ── */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; margin-bottom: 20px; }
    .panel-title { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 18px; }
    .cards-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .stat-card .sc-label { font-size: 11px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .stat-card .sc-value { font-size: 26px; font-family: var(--mono); font-weight: 600; color: var(--text); }
    .stat-card .sc-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
    .stat-card.accent { border-left: 3px solid var(--accent); }
    .stat-card.green  { border-left: 3px solid var(--green); }
    .stat-card.cyan   { border-left: 3px solid var(--accent2); }
    .stat-card.warn   { border-left: 3px solid var(--warn); }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; font-family: var(--mono); }
    .field input, .field select, .field textarea {
      padding: 10px 14px; font-size: 14px; font-family: var(--mono);
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); outline: none; transition: all 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: var(--surface3); }
    .field textarea { font-family: var(--sans); font-size: 13px; resize: vertical; min-height: 70px; }
    .field.full { grid-column: 1/-1; }

    /* Breaks */
    .breaks-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .break-row { display: flex; align-items: center; gap: 8px; }
    .break-row input { width: 80px; }
    .break-row span { font-size: 12px; color: var(--text2); }
    .break-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 2px 6px; }
    .break-remove:hover { color: var(--danger); }
    .add-break-btn {
      margin-top: 8px; padding: 7px 14px; font-size: 12px; font-family: var(--mono);
      background: var(--surface3); border: 1px dashed var(--border); border-radius: 6px;
      color: var(--text2); cursor: pointer; transition: all 0.15s; width: fit-content;
    }
    .add-break-btn:hover { border-color: var(--accent); color: var(--accent); }

    .preview-bar {
      display: flex; gap: 20px; padding: 14px 18px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; margin-top: 14px; flex-wrap: wrap;
    }
    .preview-item { font-size: 12px; color: var(--text2); font-family: var(--mono); }
    .preview-item strong { color: var(--accent2); }

    .btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .btn-primary {
      padding: 11px 28px; font-size: 13px; font-weight: 600; font-family: var(--sans);
      background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-secondary {
      padding: 11px 20px; font-size: 13px; font-family: var(--sans);
      background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: var(--text2); color: var(--text); }
    .btn-danger { background: var(--surface2); color: var(--danger); border: 1px solid var(--border); }
    .btn-danger:hover { border-color: var(--danger); }

    /* ── Quick stats bar ── */
    .quick-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .quick-btn {
      padding: 6px 14px; font-size: 12px; font-family: var(--mono); border-radius: 20px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
      cursor: pointer; transition: all 0.15s;
    }
    .quick-btn:hover, .quick-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.08); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left; padding: 9px 14px; font-size: 10px; font-weight: 700;
      color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border); background: var(--surface2); white-space: nowrap;
    }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); }
    .td-mono { font-family: var(--mono); font-size: 13px; }
    .td-hours { font-family: var(--mono); font-weight: 600; color: var(--accent2); }
    .row-actions { display: flex; gap: 6px; }
    .row-btn { padding: 4px 10px; font-size: 11px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface3); color: var(--text2); cursor: pointer; font-family: var(--mono); }
    .row-btn:hover { border-color: var(--accent); color: var(--accent); }
    .row-btn.del:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Chart ── */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(380px,1fr)); gap: 20px; }
    .chart-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .chart-wrap { position: relative; height: 220px; }

    /* ── Pay period ── */
    .pp-nav { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .pp-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    .pp-nav button:hover { border-color: var(--accent); }
    .pp-label { font-family: var(--mono); font-size: 13px; color: var(--accent2); min-width: 220px; text-align: center; }
    .pp-weeks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pp-week { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .pp-week h4 { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }

    /* ── Modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: var(--mono); font-size: 13px; letter-spacing: 1px; color: var(--accent); margin-bottom: 20px; }

    /* ── Sync panel ── */
    .sync-status-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface2); border-radius: 8px; margin-bottom: 8px; }
    .sync-status-row span { font-size: 13px; color: var(--text2); }
    .sync-status-row strong { color: var(--text); }

    .empty { text-align: center; padding: 50px 20px; color: var(--text3); font-family: var(--mono); font-size: 13px; }
    .range-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">TIMECARD.io</div>
  <div class="topbar-right">
    <div id="sync-pill" onclick="syncToSheets()">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">Sync to Sheets</span>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchTab('log',this)">LOG ENTRY</button>
  <button class="nav-btn" onclick="switchTab('history',this)">HISTORY</button>
  <button class="nav-btn" onclick="switchTab('overview',this)">OVERVIEW</button>
  <button class="nav-btn" onclick="switchTab('payperiod',this)">PAY PERIOD</button>
</div>

<!-- ══ LOG ENTRY ══ -->
<div id="tab-log" class="tab active">
  <div class="panel">
    <div class="panel-title">NEW TIME ENTRY</div>
    <div class="form-grid">
      <div class="field">
        <label>Date</label>
        <input type="date" id="e-date"/>
      </div>
      <div class="field">
        <label>Time In</label>
        <input type="time" id="e-in"/>
      </div>
      <div class="field">
        <label>Time Out</label>
        <input type="time" id="e-out"/>
      </div>
      <div class="field full">
        <label>Breaks (unpaid)</label>
        <div class="breaks-list" id="breaks-list"></div>
        <button class="add-break-btn" onclick="addBreak()">+ Add Break</button>
      </div>
      <div class="field full">
        <label>Notes (optional)</label>
        <textarea id="e-notes" placeholder="What did you work on today?"></textarea>
      </div>
    </div>
    <div class="preview-bar" id="preview-bar">
      <div class="preview-item">Duration: <strong id="pv-duration">—</strong></div>
      <div class="preview-item">Breaks: <strong id="pv-breaks">0 min</strong></div>
      <div class="preview-item">Net Hours: <strong id="pv-net">—</strong></div>
      <div class="preview-item">Day: <strong id="pv-day">—</strong></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="saveEntry()">SAVE ENTRY</button>
      <button class="btn-secondary" onclick="clearForm()">CLEAR</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">THIS WEEK AT A GLANCE</div>
    <div class="cards-row" id="week-glance"></div>
  </div>
</div>

<!-- ══ HISTORY ══ -->
<div id="tab-history" class="tab">
  <div class="panel">
    <div class="quick-bar">
      <button class="quick-btn active" data-range="this-week" onclick="setRange(this)">This Week</button>
      <button class="quick-btn" data-range="last-week" onclick="setRange(this)">Last Week</button>
      <button class="quick-btn" data-range="this-period" onclick="setRange(this)">This Pay Period</button>
      <button class="quick-btn" data-range="last-period" onclick="setRange(this)">Last Pay Period</button>
      <button class="quick-btn" data-range="all" onclick="setRange(this)">All Time</button>
    </div>
    <div class="range-row">
      <div class="field"><label>From</label><input type="date" id="h-from" onchange="renderHistory()"/></div>
      <div class="field"><label>To</label><input type="date" id="h-to" onchange="renderHistory()"/></div>
    </div>
    <div class="cards-row" id="hist-stats"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Breaks</th><th>Hours</th><th>Week Total</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ OVERVIEW ══ -->
<div id="tab-overview" class="tab">
  <div class="quick-bar">
    <button class="quick-btn active" data-range="this-week" onclick="setOvRange(this)">This Week</button>
    <button class="quick-btn" data-range="last-week" onclick="setOvRange(this)">Last Week</button>
    <button class="quick-btn" data-range="this-period" onclick="setOvRange(this)">This Pay Period</button>
    <button class="quick-btn" data-range="last-period" onclick="setOvRange(this)">Last Pay Period</button>
    <button class="quick-btn" data-range="this-month" onclick="setOvRange(this)">This Month</button>
    <button class="quick-btn" data-range="all" onclick="setOvRange(this)">All Time</button>
  </div>
  <div class="range-row">
    <div class="field"><label>From</label><input type="date" id="ov-from" onchange="renderOverview()"/></div>
    <div class="field"><label>To</label><input type="date" id="ov-to" onchange="renderOverview()"/></div>
  </div>
  <div class="charts-grid">
    <div class="chart-panel"><div class="panel-title">DAILY HOURS</div><div class="chart-wrap"><canvas id="chart-daily"></canvas></div></div>
    <div class="chart-panel"><div class="panel-title">WEEKLY TOTALS</div><div class="chart-wrap"><canvas id="chart-weekly"></canvas></div></div>
    <div class="chart-panel"><div class="panel-title">DAY OF WEEK AVERAGE</div><div class="chart-wrap"><canvas id="chart-dow"></canvas></div></div>
    <div class="chart-panel"><div class="panel-title">HOURS DISTRIBUTION</div><div class="chart-wrap"><canvas id="chart-dist"></canvas></div></div>
  </div>
</div>

<!-- ══ PAY PERIOD ══ -->
<div id="tab-payperiod" class="tab">
  <div class="panel">
    <div class="pp-nav">
      <button onclick="ppOffset--; renderPayPeriod()">←</button>
      <div class="pp-label" id="pp-label">—</div>
      <button onclick="ppOffset++; renderPayPeriod()">→</button>
      <span style="font-size:12px;color:var(--text3);font-family:var(--mono);">(bi-weekly, Sun–Sat)</span>
    </div>
    <div class="cards-row" id="pp-cards"></div>
    <div class="pp-weeks">
      <div class="pp-week"><h4>WEEK 1</h4><div id="pp-week1"></div></div>
      <div class="pp-week"><h4>WEEK 2</h4><div id="pp-week2"></div></div>
    </div>
    <div class="chart-panel" style="margin-top:16px;">
      <div class="panel-title">PAY PERIOD DAILY HOURS</div>
      <div class="chart-wrap"><canvas id="chart-pp"></canvas></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>▶ EDIT ENTRY</h3>
    <div class="form-grid">
      <div class="field"><label>Date</label><input type="date" id="m-date"/></div>
      <div class="field"><label>Time In</label><input type="time" id="m-in"/></div>
      <div class="field"><label>Time Out</label><input type="time" id="m-out"/></div>
      <div class="field full">
        <label>Breaks (unpaid)</label>
        <div class="breaks-list" id="m-breaks-list"></div>
        <button class="add-break-btn" onclick="addBreak('m')">+ Add Break</button>
      </div>
      <div class="field full"><label>Notes</label><textarea id="m-notes"></textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="saveEdit()">SAVE</button>
      <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxW5muAqzX0CcjUk_NvXtaL7g1wqMUWoevNFWFkJivLHTF0N7BiRlWgOiGioEESim0Qwg/exec';
const STORAGE_KEY = 'timecard_entries';
const SYNC_KEY    = 'timecard_last_sync';

let entries = [];
let ppOffset = 0;
let editId = null;
let ovRange = 'this-week';
let histRange = 'this-week';
let charts = {};

// ── Storage ───────────────────────────────────────────────────────────────────
function loadEntries(){ entries = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }
function saveEntries(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── Time utils ────────────────────────────────────────────────────────────────
function timeToMins(t){ if(!t)return 0; const[h,m]=t.split(':'); return parseInt(h)*60+parseInt(m); }
function minsToTime(m){ return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function minsToHours(m){ return (m/60).toFixed(2); }
function fmtHours(m){ const h=Math.floor(m/60),mn=m%60; return `${h}h ${mn}m`; }
function dayName(d){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T12:00:00').getDay()]; }
function weekStart(d){ const dt=new Date(d+'T12:00:00'); dt.setDate(dt.getDate()-dt.getDay()); return dt.toISOString().slice(0,10); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const dt=new Date(d+'T12:00:00'); dt.setDate(dt.getDate()+n); return isoDate(dt); }
function today(){ return isoDate(new Date()); }

function getNetMins(entry){
  const dur = timeToMins(entry.timeOut) - timeToMins(entry.timeIn);
  const brk = (entry.breaks||[]).reduce((s,b)=>s+(parseInt(b)||0),0);
  return Math.max(0, dur - brk);
}

// ── Pay period utils (bi-weekly, anchored to a Sunday) ────────────────────────
const PP_ANCHOR = '2025-12-28'; // first Sunday of first pay period
function getPayPeriod(offset=0){
  const anchor = new Date(PP_ANCHOR+'T12:00:00');
  const start = new Date(anchor); start.setDate(anchor.getDate() + offset*14);
  const end = new Date(start); end.setDate(start.getDate()+13);
  return { start: isoDate(start), end: isoDate(end) };
}
function currentPPOffset(){
  const anchor = new Date(PP_ANCHOR+'T12:00:00');
  const now = new Date();
  const diff = Math.floor((now-anchor)/(14*24*60*60*1000));
  return diff;
}

// ── Date range helpers ────────────────────────────────────────────────────────
function getRangeDates(range){
  const t = today();
  const ws = weekStart(t);
  const pp = getPayPeriod(currentPPOffset());
  const lpp = getPayPeriod(currentPPOffset()-1);
  const lws = addDays(ws,-7);
  const thisMonthStart = t.slice(0,8)+'01';
  switch(range){
    case 'this-week':   return {from:ws, to:addDays(ws,6)};
    case 'last-week':   return {from:lws, to:addDays(lws,6)};
    case 'this-period': return {from:pp.start, to:pp.end};
    case 'last-period': return {from:lpp.start, to:lpp.end};
    case 'this-month':  return {from:thisMonthStart, to:t};
    case 'all':         return {from:'2000-01-01', to:'2099-01-01'};
    default:            return {from:ws, to:addDays(ws,6)};
  }
}
function filterEntries(from, to){ return entries.filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>a.date<b.date?-1:1); }

// ── Init ──────────────────────────────────────────────────────────────────────
function init(){
  loadEntries();
  // Set default date to today
  document.getElementById('e-date').value = today();
  setRangeDates('h-from','h-to','this-week');
  setRangeDates('ov-from','ov-to','this-week');
  renderWeekGlance();
  renderHistory();
  renderOverview();
  renderPayPeriod();
  updatePreview();
  updateSyncStatus();
  // Live preview
  ['e-date','e-in','e-out'].forEach(id=>document.getElementById(id).addEventListener('change',updatePreview));
}

function setRangeDates(fromId, toId, range){
  const {from,to}=getRangeDates(range);
  document.getElementById(fromId).value=from;
  document.getElementById(toId).value=to;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='overview') renderOverview();
  if(name==='payperiod') renderPayPeriod();
}

// ── Breaks ────────────────────────────────────────────────────────────────────
let breakCount = 0;
function addBreak(prefix=''){
  breakCount++;
  const list = document.getElementById(prefix?'m-breaks-list':'breaks-list');
  const div = document.createElement('div');
  div.className='break-row'; div.id=(prefix?'mb':'b')+breakCount;
  div.innerHTML=`<input type="number" min="0" placeholder="0" style="width:80px;" onchange="updatePreview()"/>
    <span>minutes</span>
    <button class="break-remove" onclick="this.parentElement.remove();updatePreview()">×</button>`;
  list.appendChild(div);
}
function getBreaks(prefix=''){
  const list = document.getElementById(prefix?'m-breaks-list':'breaks-list');
  return [...list.querySelectorAll('input[type=number]')].map(i=>parseInt(i.value)||0).filter(v=>v>0);
}
function getTotalBreakMins(prefix=''){ return getBreaks(prefix).reduce((s,b)=>s+b,0); }

// ── Preview ───────────────────────────────────────────────────────────────────
function updatePreview(){
  const d=document.getElementById('e-date').value;
  const ti=document.getElementById('e-in').value;
  const to=document.getElementById('e-out').value;
  const brk=getTotalBreakMins();
  document.getElementById('pv-day').textContent = d?dayName(d):'—';
  document.getElementById('pv-breaks').textContent = brk+' min';
  if(ti&&to){
    const dur=timeToMins(to)-timeToMins(ti);
    const net=Math.max(0,dur-brk);
    document.getElementById('pv-duration').textContent=fmtHours(dur);
    document.getElementById('pv-net').textContent=fmtHours(net);
  } else {
    document.getElementById('pv-duration').textContent='—';
    document.getElementById('pv-net').textContent='—';
  }
}

// ── Save entry ────────────────────────────────────────────────────────────────
function saveEntry(){
  const date=document.getElementById('e-date').value;
  const timeIn=document.getElementById('e-in').value;
  const timeOut=document.getElementById('e-out').value;
  const notes=document.getElementById('e-notes').value.trim();
  if(!date||!timeIn||!timeOut){alert('Please fill in Date, Time In, and Time Out.');return;}
  if(timeToMins(timeOut)<=timeToMins(timeIn)){alert('Time Out must be after Time In.');return;}
  const breaks=getBreaks();
  const entry = { id:genId(), date, timeIn, timeOut, breaks, notes, day:dayName(date), netMins:getNetMins({timeIn,timeOut,breaks}) };
  entries.push(entry);
  saveEntries();
  clearForm();
  renderWeekGlance();
  renderHistory();
  setSyncDirty();
}

function clearForm(){
  document.getElementById('e-date').value=today();
  document.getElementById('e-in').value='';
  document.getElementById('e-out').value='';
  document.getElementById('e-notes').value='';
  document.getElementById('breaks-list').innerHTML='';
  updatePreview();
}

// ── Week glance ───────────────────────────────────────────────────────────────
function renderWeekGlance(){
  const ws=weekStart(today());
  const we=addDays(ws,6);
  const wEntries=filterEntries(ws,we);
  const totalMins=wEntries.reduce((s,e)=>s+e.netMins,0);
  const daysWorked=new Set(wEntries.map(e=>e.date)).size;
  const avgMins=daysWorked>0?totalMins/daysWorked:0;
  const todayMins=wEntries.filter(e=>e.date===today()).reduce((s,e)=>s+e.netMins,0);
  document.getElementById('week-glance').innerHTML=`
    <div class="stat-card accent"><div class="sc-label">This Week</div><div class="sc-value">${fmtHours(totalMins)}</div><div class="sc-sub">${daysWorked} days worked</div></div>
    <div class="stat-card cyan"><div class="sc-label">Today</div><div class="sc-value">${fmtHours(todayMins)}</div><div class="sc-sub">${today()}</div></div>
    <div class="stat-card green"><div class="sc-label">Daily Avg</div><div class="sc-value">${fmtHours(Math.round(avgMins))}</div><div class="sc-sub">this week</div></div>
    <div class="stat-card warn"><div class="sc-label">Entries</div><div class="sc-value">${wEntries.length}</div><div class="sc-sub">this week</div></div>
  `;
}

// ── History ───────────────────────────────────────────────────────────────────
function setRange(btn){
  document.querySelectorAll('#tab-history .quick-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  histRange=btn.dataset.range;
  setRangeDates('h-from','h-to',histRange);
  renderHistory();
}

function renderHistory(){
  const from=document.getElementById('h-from').value;
  const to=document.getElementById('h-to').value;
  const filtered=filterEntries(from,to).reverse();
  const totalMins=filtered.reduce((s,e)=>s+e.netMins,0);
  const daysWorked=new Set(filtered.map(e=>e.date)).size;

  // Week totals
  const weekMap={};
  filtered.forEach(e=>{const ws=weekStart(e.date);weekMap[ws]=(weekMap[ws]||0)+e.netMins;});

  document.getElementById('hist-stats').innerHTML=`
    <div class="stat-card accent"><div class="sc-label">Total Hours</div><div class="sc-value">${minsToHours(totalMins)}</div><div class="sc-sub">${fmtHours(totalMins)}</div></div>
    <div class="stat-card green"><div class="sc-label">Days Worked</div><div class="sc-value">${daysWorked}</div><div class="sc-sub">${filtered.length} entries</div></div>
    <div class="stat-card cyan"><div class="sc-label">Daily Avg</div><div class="sc-value">${daysWorked>0?fmtHours(Math.round(totalMins/daysWorked)):'—'}</div></div>
    <div class="stat-card warn"><div class="sc-label">Weeks</div><div class="sc-value">${Object.keys(weekMap).length}</div><div class="sc-sub">in range</div></div>
  `;

  const tbody=document.getElementById('hist-body');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="9" class="empty">No entries in this range</td></tr>';return;}
  const wsTotals={};filtered.forEach(e=>{const ws=weekStart(e.date);wsTotals[ws]=(wsTotals[ws]||0)+e.netMins;});
  tbody.innerHTML=filtered.map(e=>`
    <tr>
      <td class="td-mono">${e.date}</td>
      <td class="td-mono" style="color:var(--text3)">${e.day||dayName(e.date)}</td>
      <td class="td-mono">${e.timeIn}</td>
      <td class="td-mono">${e.timeOut}</td>
      <td class="td-mono" style="color:var(--text3)">${(e.breaks||[]).reduce((s,b)=>s+(parseInt(b)||0),0)}m</td>
      <td class="td-hours">${minsToHours(e.netMins)}h</td>
      <td class="td-mono" style="color:var(--text2)">${fmtHours(wsTotals[weekStart(e.date)])}</td>
      <td style="color:var(--text2);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.notes||''}</td>
      <td><div class="row-actions">
        <button class="row-btn" onclick="openEdit('${e.id}')">Edit</button>
        <button class="row-btn del" onclick="deleteEntry('${e.id}')">Del</button>
      </div></td>
    </tr>`).join('');
}

// ── Overview ──────────────────────────────────────────────────────────────────
function setOvRange(btn){
  document.querySelectorAll('#tab-overview .quick-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ovRange=btn.dataset.range;
  setRangeDates('ov-from','ov-to',ovRange);
  renderOverview();
}

function renderOverview(){
  const from=document.getElementById('ov-from').value;
  const to=document.getElementById('ov-to').value;
  const filtered=filterEntries(from,to);
  const CHART_OPTS = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#475569',font:{size:10}}},y:{ticks:{color:'#475569',font:{size:10}},grid:{color:'rgba(71,85,105,0.2)'}}}};

  // Daily hours
  const dailyMap={};filtered.forEach(e=>{dailyMap[e.date]=(dailyMap[e.date]||0)+e.netMins;});
  const dailyLabels=Object.keys(dailyMap).sort();
  const dailyVals=dailyLabels.map(d=>parseFloat(minsToHours(dailyMap[d])));
  mkChart('chart-daily','bar',dailyLabels.map(d=>d.slice(5)),dailyVals,'#6366f1',CHART_OPTS);

  // Weekly totals
  const weekMap={};filtered.forEach(e=>{const ws=weekStart(e.date);weekMap[ws]=(weekMap[ws]||0)+e.netMins;});
  const wkLabels=Object.keys(weekMap).sort();
  mkChart('chart-weekly','bar',wkLabels.map(w=>w.slice(5)),wkLabels.map(w=>parseFloat(minsToHours(weekMap[w]))),'#22d3ee',CHART_OPTS);

  // Day of week avg
  const dowMap={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  filtered.forEach(e=>{const d=new Date(e.date+'T12:00:00').getDay();dowMap[d].push(e.netMins);});
  const dowAvgs=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>dowMap[i].length?parseFloat(minsToHours(Math.round(dowMap[i].reduce((a,b)=>a+b,0)/dowMap[i].length))):0);
  mkChart('chart-dow','bar',['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],dowAvgs,'#4ade80',CHART_OPTS);

  // Distribution (donut)
  const totalMins=filtered.reduce((s,e)=>s+e.netMins,0);
  const distMap={};filtered.forEach(e=>{const d=new Date(e.date+'T12:00:00').getDay();distMap[['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]]=(distMap[['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]]||0)+e.netMins;});
  if(charts['chart-dist'])charts['chart-dist'].destroy();
  charts['chart-dist']=new Chart(document.getElementById('chart-dist'),{
    type:'doughnut',
    data:{labels:Object.keys(distMap),datasets:[{data:Object.values(distMap).map(m=>parseFloat(minsToHours(m))),backgroundColor:['#6366f1','#22d3ee','#4ade80','#fb923c','#f43f5e','#a855f7','#eab308'],borderWidth:2,borderColor:'#111118'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:11},boxWidth:12}}}}
  });
}

function mkChart(id,type,labels,data,color,opts){
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(document.getElementById(id),{
    type,data:{labels,datasets:[{data,backgroundColor:color+'33',borderColor:color,borderWidth:2,borderRadius:4,fill:type==='line'}]},
    options:{...opts,plugins:{...opts.plugins}}
  });
}

// ── Pay Period ────────────────────────────────────────────────────────────────
function renderPayPeriod(){
  const pp=getPayPeriod(currentPPOffset()+ppOffset);
  document.getElementById('pp-label').textContent=`${pp.start}  →  ${pp.end}`;
  const ppEntries=filterEntries(pp.start,pp.end);
  const totalMins=ppEntries.reduce((s,e)=>s+e.netMins,0);
  const daysWorked=new Set(ppEntries.map(e=>e.date)).size;

  document.getElementById('pp-cards').innerHTML=`
    <div class="stat-card accent"><div class="sc-label">Period Total</div><div class="sc-value">${fmtHours(totalMins)}</div><div class="sc-sub">${minsToHours(totalMins)} hrs</div></div>
    <div class="stat-card green"><div class="sc-label">Days Worked</div><div class="sc-value">${daysWorked}</div></div>
    <div class="stat-card cyan"><div class="sc-label">Entries</div><div class="sc-value">${ppEntries.length}</div></div>
    <div class="stat-card warn"><div class="sc-label">Daily Avg</div><div class="sc-value">${daysWorked>0?fmtHours(Math.round(totalMins/daysWorked)):'—'}</div></div>
  `;

  // Week 1 & 2
  const w1start=pp.start, w1end=addDays(pp.start,6);
  const w2start=addDays(pp.start,7), w2end=pp.end;
  [['pp-week1',w1start,w1end],['pp-week2',w2start,w2end]].forEach(([id,ws,we])=>{
    const wEntries=filterEntries(ws,we);
    const wMins=wEntries.reduce((s,e)=>s+e.netMins,0);
    document.getElementById(id).innerHTML=`
      <div style="font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:10px;">${ws} → ${we}</div>
      <div style="font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent2);">${fmtHours(wMins)}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px;">${new Set(wEntries.map(e=>e.date)).size} days · ${wEntries.length} entries</div>
    `;
  });

  // PP daily chart
  const allDates=[];let d=pp.start;while(d<=pp.end){allDates.push(d);d=addDays(d,1);}
  const dayMap={};ppEntries.forEach(e=>{dayMap[e.date]=(dayMap[e.date]||0)+e.netMins;});
  const CHART_OPTS={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#475569',font:{size:10}}},y:{ticks:{color:'#475569',font:{size:10}},grid:{color:'rgba(71,85,105,0.2)'}}}};
  mkChart('chart-pp','bar',allDates.map(d=>d.slice(5)+' '+dayName(d)),allDates.map(d=>parseFloat(minsToHours(dayMap[d]||0))),'#6366f1',CHART_OPTS);
}

// ── Edit / Delete ─────────────────────────────────────────────────────────────
function openEdit(id){
  editId=id;
  const e=entries.find(e=>e.id===id);
  if(!e)return;
  document.getElementById('m-date').value=e.date;
  document.getElementById('m-in').value=e.timeIn;
  document.getElementById('m-out').value=e.timeOut;
  document.getElementById('m-notes').value=e.notes||'';
  document.getElementById('m-breaks-list').innerHTML='';
  (e.breaks||[]).forEach(b=>{ const bId=++breakCount; const list=document.getElementById('m-breaks-list'); const div=document.createElement('div'); div.className='break-row'; div.innerHTML=`<input type="number" min="0" value="${b}" style="width:80px;"/><span>minutes</span><button class="break-remove" onclick="this.parentElement.remove()">×</button>`; list.appendChild(div); });
  document.getElementById('edit-modal').style.display='flex';
}
function closeModal(){ document.getElementById('edit-modal').style.display='none'; editId=null; }
function saveEdit(){
  const idx=entries.findIndex(e=>e.id===editId);
  if(idx<0)return;
  const date=document.getElementById('m-date').value;
  const timeIn=document.getElementById('m-in').value;
  const timeOut=document.getElementById('m-out').value;
  const notes=document.getElementById('m-notes').value.trim();
  const breaks=getBreaks('m');
  entries[idx]={...entries[idx],date,timeIn,timeOut,notes,breaks,day:dayName(date),netMins:getNetMins({timeIn,timeOut,breaks})};
  saveEntries();closeModal();renderHistory();renderWeekGlance();setSyncDirty();
}
function deleteEntry(id){
  if(!confirm('Delete this entry?'))return;
  entries=entries.filter(e=>e.id!==id);
  saveEntries();renderHistory();renderWeekGlance();setSyncDirty();
}

// ── Google Sheets Sync ────────────────────────────────────────────────────────
function setSyncDirty(){
  localStorage.removeItem(SYNC_KEY);
  updateSyncStatus();
}

function updateSyncStatus(){
  const lastSync=localStorage.getItem(SYNC_KEY);
  const dot=document.getElementById('sync-dot');
  const text=document.getElementById('sync-text');
  if(!lastSync){ dot.className='sync-dot'; text.textContent='Sync to Sheets'; }
  else { dot.className='sync-dot synced'; text.textContent='Synced · '+lastSync; }
}

async function syncToSheets(){
  if(!entries.length){ alert('No entries to sync.'); return; }
  const dot=document.getElementById('sync-dot');
  const text=document.getElementById('sync-text');
  dot.className='sync-dot syncing'; text.textContent='Syncing...';
  try {
    const payload = entries.map(e=>({
      id: e.id,
      date: e.date,
      day: e.day||dayName(e.date),
      timeIn: e.timeIn,
      timeOut: e.timeOut,
      breakMins: (e.breaks||[]).reduce((s,b)=>s+(parseInt(b)||0),0),
      netHours: parseFloat(minsToHours(e.netMins)),
      notes: e.notes||''
    }));
    const url=`${APPS_SCRIPT}?action=sync&entries=${encodeURIComponent(JSON.stringify(payload))}`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.success){
      const t=new Date().toLocaleTimeString();
      localStorage.setItem(SYNC_KEY,t);
      dot.className='sync-dot synced';
      text.textContent=`Synced ${json.synced} entries · ${t}`;
    } else throw new Error('Sync failed');
  } catch(e){
    dot.className='sync-dot error';
    text.textContent='Sync failed — check connection';
  }
}

init();
</script>
