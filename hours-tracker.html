<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMECARD — Hours Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --surface3: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --accent: #e8ff00;
    --accent2: #ff6b35;
    --accent3: #00d4ff;
    --text: #f0f0f0;
    --text2: #888888;
    --text3: #555555;
    --danger: #ff4444;
    --success: #44ff88;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  .logo span {
    color: var(--text3);
    font-weight: 400;
  }

  .header-meta {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text3);
    letter-spacing: 0.05em;
  }

  /* TABS */
  .tabs {
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 2rem;
    gap: 0;
  }

  .tab {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.9rem 1.5rem;
    cursor: pointer;
    color: var(--text3);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }

  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PANELS */
  .panel { display: none; padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .panel.active { display: block; }

  /* SECTION LABEL */
  .section-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  /* LOG ENTRY FORM */
  .log-form {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .form-title {
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .form-title::before {
    content: '▶';
    font-size: 0.6rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.55rem 0.75rem;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }

  .field textarea {
    resize: vertical;
    min-height: 60px;
    font-size: 0.8rem;
  }

  .field select option {
    background: var(--surface2);
  }

  .breaks-section {
    margin-top: 1rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }

  .breaks-title {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .break-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .break-row input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    outline: none;
    width: 120px;
    transition: border-color 0.15s;
  }

  .break-row input:focus { border-color: var(--accent2); }

  .break-sep {
    color: var(--text3);
    font-family: var(--mono);
    font-size: 0.75rem;
  }

  .btn-remove-break {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 0.25rem;
    opacity: 0.6;
    transition: opacity 0.15s;
  }

  .btn-remove-break:hover { opacity: 1; }

  .btn-add-break {
    background: none;
    border: 1px dashed var(--border2);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-add-break:hover { border-color: var(--accent2); color: var(--accent2); }

  .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
    align-items: center;
  }

  .btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.6rem 1.25rem;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-weight: 600;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover { background: #d4e800; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
  }

  .btn-secondary:hover { border-color: var(--text2); color: var(--text); }

  .btn-danger {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 0.65rem;
    padding: 0.35rem 0.75rem;
  }

  .btn-danger:hover { background: var(--danger); color: #000; }

  .btn-edit {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-size: 0.65rem;
    padding: 0.35rem 0.75rem;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-edit:hover { border-color: var(--accent3); color: var(--accent3); }

  .calc-preview {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    margin-left: auto;
  }

  /* ENTRIES TABLE */
  .entries-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .filter-bar {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-bar input, .filter-bar select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 0.4rem 0.75rem;
    outline: none;
    transition: border-color 0.15s;
  }

  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent); }

  .filter-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    letter-spacing: 0.08em;
  }

  .entries-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 0.78rem;
  }

  .entries-table th {
    text-align: left;
    padding: 0.6rem 0.75rem;
    color: var(--text3);
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }

  .entries-table td {
    padding: 0.65rem 0.75rem;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  .entries-table tr:hover td { background: var(--surface); }

  .hours-pill {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .hours-pill.long { background: rgba(255, 107, 53, 0.15); color: var(--accent2); }
  .hours-pill.normal { background: rgba(232, 255, 0, 0.1); color: var(--accent); }
  .hours-pill.short { background: rgba(255, 255, 255, 0.05); color: var(--text2); }

  .note-cell {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text3);
    font-size: 0.72rem;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .empty-state::before {
    content: '[ NO ENTRIES ]';
    display: block;
    font-size: 1rem;
    color: var(--border2);
    margin-bottom: 0.75rem;
    letter-spacing: 0.2em;
  }

  /* SUMMARY STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    padding: 1.25rem 1.5rem;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-value.orange { color: var(--accent2); }
  .stat-value.blue { color: var(--accent3); }
  .stat-value.white { color: var(--text); }

  .stat-sub {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    margin-top: 0.3rem;
  }

  /* CHARTS */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  @media (max-width: 750px) {
    .charts-grid { grid-template-columns: 1fr; }
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.25rem;
  }

  .chart-title {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .chart-wrap {
    position: relative;
    height: 220px;
  }

  /* OVERTIME ALERT */
  .overtime-alert {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(255, 107, 53, 0.08);
    border: 1px solid rgba(255, 107, 53, 0.3);
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent2);
  }

  .alert-icon { font-size: 1rem; }

  /* PAY PERIOD NAVIGATOR */
  .period-nav {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .period-nav button {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 0.8rem;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .period-nav button:hover { border-color: var(--accent); color: var(--accent); }

  .period-label {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .period-sublabel {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    margin-left: 0.5rem;
  }

  /* WEEK GRID */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .week-day {
    background: var(--surface);
    padding: 0.75rem 0.5rem;
    text-align: center;
  }

  .week-day-name {
    font-family: var(--mono);
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .week-day-date {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text2);
    margin-bottom: 0.4rem;
  }

  .week-day-hours {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
  }

  .week-day-hours.zero { color: var(--text3); }
  .week-day-hours.overtime { color: var(--accent2); }

  .week-day.today { background: var(--surface2); }
  .week-day.today .week-day-date { color: var(--accent); }

  /* RANGE FILTER */
  .range-filter {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .range-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .range-btn:hover, .range-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232, 255, 0, 0.05); }

  .range-sep { color: var(--text3); font-family: var(--mono); font-size: 0.7rem; }

  /* SCROLL */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 0.75rem 1.25rem;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    padding: 2rem;
    width: 90%;
    max-width: 520px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
  }

  .modal-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  .day-bar-wrapper {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.4rem;
  }

  .day-bar-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    width: 28px;
  }

  .day-bar-track {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 0;
    overflow: hidden;
  }

  .day-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  .day-bar-fill.overtime { background: var(--accent2); }

  .day-bar-val {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text2);
    width: 40px;
    text-align: right;
  }
</style>
</head>
<body>

<header>
  <div class="logo">TIMECARD<span>.io</span></div>
  <div class="header-meta" id="header-date"></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('log')">LOG ENTRY</button>
  <button class="tab" onclick="switchTab('history')">HISTORY</button>
  <button class="tab" onclick="switchTab('overview')">OVERVIEW</button>
  <button class="tab" onclick="switchTab('payperiod')">PAY PERIOD</button>
</div>

<!-- LOG ENTRY PANEL -->
<div class="panel active" id="panel-log">
  <div class="log-form">
    <div class="form-title">NEW TIME ENTRY</div>
    <div class="form-grid">
      <div class="field">
        <label>Date</label>
        <input type="date" id="entry-date">
      </div>
      <div class="field">
        <label>Time In</label>
        <input type="time" id="entry-in">
      </div>
      <div class="field">
        <label>Time Out</label>
        <input type="time" id="entry-out">
      </div>
    </div>

    <div class="breaks-section">
      <div class="breaks-title">Breaks (unpaid)</div>
      <div id="breaks-container"></div>
      <button class="btn-add-break" onclick="addBreak()">+ Add Break</button>
    </div>

    <div class="field" style="margin-top:1rem;">
      <label>Notes (optional)</label>
      <textarea id="entry-notes" placeholder="e.g. Remote day, training, etc."></textarea>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveEntry()">SAVE ENTRY</button>
      <button class="btn btn-secondary" onclick="clearForm()">CLEAR</button>
      <div class="calc-preview" id="calc-preview"></div>
    </div>
  </div>

  <!-- Quick week view -->
  <div class="section-label">THIS WEEK AT A GLANCE</div>
  <div id="quick-week"></div>
</div>

<!-- HISTORY PANEL -->
<div class="panel" id="panel-history">
  <div class="range-filter">
    <span class="filter-label">QUICK:</span>
    <button class="range-btn" onclick="quickFilter('week')">THIS WEEK</button>
    <button class="range-btn" onclick="quickFilter('lastweek')">LAST WEEK</button>
    <button class="range-btn" onclick="quickFilter('period')">THIS PAY PERIOD</button>
    <button class="range-btn" onclick="quickFilter('lastperiod')">LAST PAY PERIOD</button>
    <button class="range-btn active" onclick="quickFilter('all')">ALL TIME</button>
    <span class="range-sep">|</span>
    <span class="filter-label">FROM:</span>
    <input type="date" id="filter-from" onchange="renderHistory()">
    <span class="filter-label">TO:</span>
    <input type="date" id="filter-to" onchange="renderHistory()">
  </div>

  <div id="history-summary-bar" style="margin-bottom:1rem;"></div>

  <table class="entries-table">
    <thead>
      <tr>
        <th>DATE</th>
        <th>DAY</th>
        <th>IN</th>
        <th>OUT</th>
        <th>BREAKS</th>
        <th>HOURS</th>
        <th>WEEK</th>
        <th>NOTES</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
</div>

<!-- OVERVIEW PANEL -->
<div class="panel" id="panel-overview">
  <div class="range-filter">
    <span class="filter-label">RANGE:</span>
    <button class="range-btn" onclick="ovQuick('week')">THIS WEEK</button>
    <button class="range-btn" onclick="ovQuick('lastweek')">LAST WEEK</button>
    <button class="range-btn active" onclick="ovQuick('period')">THIS PAY PERIOD</button>
    <button class="range-btn" onclick="ovQuick('lastperiod')">LAST PAY PERIOD</button>
    <button class="range-btn" onclick="ovQuick('month')">THIS MONTH</button>
    <button class="range-btn" onclick="ovQuick('all')">ALL TIME</button>
    <span class="range-sep">|</span>
    <input type="date" id="ov-from" onchange="renderOverview()">
    <span class="filter-label">TO</span>
    <input type="date" id="ov-to" onchange="renderOverview()">
  </div>

  <div id="overtime-alert"></div>

  <div class="stats-grid" id="ov-stats"></div>

  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">DAILY HOURS</div>
      <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">WEEKLY TOTALS</div>

<div class="modal-overlay" id="edit-modal">

        <label>Time In</label>
        <input type="time" id="edit-in">
      </div>
      <div class="field">
        <label>Time Out</label>
        <input type="time" id="edit-out">
      </div>
    </div>

      <div class="breaks-title">Breaks (unpaid)</div>

      <button class="btn-add-break" onclick="addBreak('edit')">+ Add Break</button>

      <label>Notes</label>

      <button class="btn btn-secondary" onclick="closeModal()">CANCEL</button>
    </div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const STORAGE_KEY = 'timecard_entries_v2';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ============================================================
// HELPERS
// ============================================================
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parseTime(str) {
  if (!str) return null;
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function minutesToHours(m) { return m / 60; }

function calcHours(entry) {
  if (!entry.timeIn || !entry.timeOut) return 0;
  let mins = parseTime(entry.timeOut) - parseTime(entry.timeIn);
  if (mins < 0) mins += 1440; // overnight
  const breakMins = (entry.breaks || []).reduce((acc, b) => {
    if (!b.start || !b.end) return acc;
    let bm = parseTime(b.end) - parseTime(b.start);
    if (bm < 0) bm += 1440;
    return acc + bm;
  }, 0);
  return Math.max(0, (mins - breakMins) / 60);
}

function fmt(h) { return h.toFixed(2) + 'h'; }

function fmtBreaks(breaks) {
  if (!breaks || !breaks.length) return '—';
  const total = breaks.reduce((acc, b) => {
    if (!b.start || !b.end) return acc;
    let m = parseTime(b.end) - parseTime(b.start);
    if (m < 0) m += 1440;
    return acc + m;
  }, 0);
  return total > 0 ? total + 'm' : '—';
}

function toDateStr(d) {
  return d.toISOString().slice(0,10);
}

function startOfWeek(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}

// Pay period: bi-weekly starting from a known Sunday
// Using 2024-01-07 as anchor (first Sunday of 2024)
const ANCHOR = new Date('2024-01-07');

function getPayPeriod(date) {
  const d = new Date(date);
  const diff = Math.floor((d - ANCHOR) / (1000 * 60 * 60 * 24 * 7));
  const periodNum = Math.floor(diff / 2);
  const start = new Date(ANCHOR);
  start.setDate(start.getDate() + periodNum * 14);
  const end = new Date(start);
  end.setDate(end.getDate() + 13);
  return { start: toDateStr(start), end: toDateStr(end), num: periodNum };
}

function getPayPeriodByOffset(offset) {
  const today = new Date();
  const current = getPayPeriod(today);
  const start = new Date(current.start);
  start.setDate(start.getDate() + offset * 14);
  const end = new Date(start);
  end.setDate(end.getDate() + 13);
  return { start: toDateStr(start), end: toDateStr(end) };
}

function formatDateDisplay(str) {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateShort(str) {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function getWeekStr(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const sw = startOfWeek(d);
  const ew = new Date(sw); ew.setDate(ew.getDate() + 6);
  return toDateStr(sw) + ' — ' + toDateStr(ew);
}

// ============================================================
// BREAKS UI
// ============================================================
let breaks = [];

function addBreak(ctx) {
  const container = ctx === 'edit' ? document.getElementById('edit-breaks-container') : document.getElementById('breaks-container');
  const id = Date.now();
  const row = document.createElement('div');
  row.className = 'break-row';
  row.id = 'break-' + id;
  row.innerHTML = `
    <input type="time" placeholder="Start" class="break-start">
    <span class="break-sep">→</span>
    <input type="time" placeholder="End" class="break-end">
    <button class="btn-remove-break" onclick="removeBreak('${id}')">✕</button>
  `;
  container.appendChild(row);
}

function removeBreak(id) {
  const el = document.getElementById('break-' + id);
  if (el) el.remove();
}

function collectBreaks(containerId) {
  const rows = document.getElementById(containerId).querySelectorAll('.break-row');
  const result = [];
  rows.forEach(row => {
    const start = row.querySelector('.break-start').value;
    const end = row.querySelector('.break-end').value;
    if (start || end) result.push({ start, end });
  });
  return result;
}

function fillBreaks(breaks, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  (breaks || []).forEach((b, i) => {
    const id = Date.now() + i;
    const row = document.createElement('div');
    row.className = 'break-row';
    row.id = 'break-' + id;
    row.innerHTML = `
      <input type="time" value="${b.start || ''}" class="break-start">
      <span class="break-sep">→</span>
      <input type="time" value="${b.end || ''}" class="break-end">
      <button class="btn-remove-break" onclick="removeBreak('${id}')">✕</button>
    `;
    container.appendChild(row);
  });
}

// Live calc preview
function updateCalcPreview() {
  const d = document.getElementById('entry-date').value;
  const i = document.getElementById('entry-in').value;
  const o = document.getElementById('entry-out').value;
  const brks = collectBreaks('breaks-container');
  if (i && o) {
    const h = calcHours({ timeIn: i, timeOut: o, breaks: brks });
    document.getElementById('calc-preview').textContent = '= ' + fmt(h);
  } else {
    document.getElementById('calc-preview').textContent = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('entry-in').addEventListener('change', updateCalcPreview);
  document.getElementById('entry-out').addEventListener('change', updateCalcPreview);

  // Set today's date
  const today = toDateStr(new Date());
  document.getElementById('entry-date').value = today;
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US', { weekday:'short', month:'long', day:'numeric', year:'numeric' });

  renderQuickWeek();
  renderHistory();
  renderOverview();
  renderPayPeriod();

  // Delegate break changes to recalc
  document.getElementById('breaks-container').addEventListener('change', updateCalcPreview);
});

// ============================================================
// SAVE ENTRY
// ============================================================
function saveEntry() {
  const date = document.getElementById('entry-date').value;
  const timeIn = document.getElementById('entry-in').value;
  const timeOut = document.getElementById('entry-out').value;
  const notes = document.getElementById('entry-notes').value.trim();
  const brks = collectBreaks('breaks-container');

  if (!date || !timeIn || !timeOut) {
    showToast('Date, time in, and time out are required.', 'error');
    return;
  }

  const entries = loadEntries();
  const existing = entries.find(e => e.date === date);
  if (existing) {
    if (!confirm(`An entry already exists for ${formatDateDisplay(date)}. Replace it?`)) return;
    entries.splice(entries.indexOf(existing), 1);
  }

  entries.push({ id: genId(), date, timeIn, timeOut, breaks: brks, notes });
  entries.sort((a,b) => a.date.localeCompare(b.date));
  saveEntries(entries);

  showToast('Entry saved ✓', 'success');
  clearForm();
  renderQuickWeek();
  renderHistory();
  renderOverview();
  renderPayPeriod();
}

function clearForm() {
  document.getElementById('entry-date').value = toDateStr(new Date());
  document.getElementById('entry-in').value = '';
  document.getElementById('entry-out').value = '';
  document.getElementById('entry-notes').value = '';
  document.getElementById('breaks-container').innerHTML = '';
  document.getElementById('calc-preview').textContent = '';
}

// ============================================================
// QUICK WEEK
// ============================================================
function renderQuickWeek() {
  const today = new Date();
  const sw = startOfWeek(today);
  const entries = loadEntries();
  const html = [];

  html.push('<div class="week-grid">');
  for (let i = 0; i < 7; i++) {
    const d = new Date(sw); d.setDate(d.getDate() + i);
    const ds = toDateStr(d);
    const entry = entries.find(e => e.date === ds);
    const h = entry ? calcHours(entry) : 0;
    const isToday = ds === toDateStr(today);
    const hoursClass = h === 0 ? 'zero' : h > 10 ? 'overtime' : '';
    html.push(`<div class="week-day${isToday ? ' today' : ''}">
      <div class="week-day-name">${DAYS[d.getDay()]}</div>
      <div class="week-day-date">${d.getMonth()+1}/${d.getDate()}</div>
      <div class="week-day-hours ${hoursClass}">${h === 0 ? '—' : fmt(h)}</div>
    </div>`);
  }
  html.push('</div>');

  const totalThisWeek = entries
    .filter(e => e.date >= toDateStr(sw) && e.date <= toDateStr(today))
    .reduce((acc, e) => acc + calcHours(e), 0);

  document.getElementById('quick-week').innerHTML = html.join('') +
    `<div style="font-family:var(--mono);font-size:0.75rem;color:var(--text3);margin-top:0.5rem;">
      Week total so far: <span style="color:var(--accent);font-weight:700;">${fmt(totalThisWeek)}</span>
    </div>`;
}

// ============================================================
// HISTORY
// ============================================================
let historyRange = { from: '', to: '' };

function quickFilter(type) {
  document.querySelectorAll('.range-filter .range-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const today = new Date();
  let from, to;

  if (type === 'week') {
    const sw = startOfWeek(today);
    from = toDateStr(sw);
    to = toDateStr(today);
  } else if (type === 'lastweek') {
    const lw = startOfWeek(today); lw.setDate(lw.getDate()-7);
    const le = new Date(lw); le.setDate(le.getDate()+6);
    from = toDateStr(lw); to = toDateStr(le);
  } else if (type === 'period') {
    const p = getPayPeriod(today);
    from = p.start; to = toDateStr(today);
  } else if (type === 'lastperiod') {
    const p = getPayPeriodByOffset(-1);
    from = p.start; to = p.end;
  } else {
    from = ''; to = '';
  }

  document.getElementById('filter-from').value = from;
  document.getElementById('filter-to').value = to;
  renderHistory();
}

function renderHistory() {
  const entries = loadEntries();
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;

  const filtered = entries.filter(e => {
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    return true;
  });

  // Summary bar
  const totalH = filtered.reduce((a, e) => a + calcHours(e), 0);
  const days = filtered.length;
  document.getElementById('history-summary-bar').innerHTML = days > 0
    ? `<div style="font-family:var(--mono);font-size:0.75rem;color:var(--text2);">
        Showing <span style="color:var(--text)">${days}</span> entries — 
        Total: <span style="color:var(--accent);font-weight:700;">${fmt(totalH)}</span>
        ${days > 0 ? '— Avg: <span style="color:var(--text2)">' + fmt(totalH/days) + '/day</span>' : ''}
      </div>` : '';

  // Build weekly totals for column
  const weekTotals = {};
  filtered.forEach(e => {
    const w = getWeekStr(e.date);
    weekTotals[w] = (weekTotals[w] || 0) + calcHours(e);
  });

  const tbody = document.getElementById('history-body');

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">No entries in selected range</div></td></tr>`;
    return;
  }

  tbody.innerHTML = [...filtered].reverse().map(e => {
    const h = calcHours(e);
    const d = new Date(e.date + 'T12:00:00');
    const pillClass = h >= 10 ? 'long' : h >= 6 ? 'normal' : 'short';
    const wk = getWeekStr(e.date);
    const wkTotal = weekTotals[wk] || 0;
    return `<tr>
      <td>${formatDateDisplay(e.date)}</td>
      <td style="color:var(--text3)">${DAYS_FULL[d.getDay()]}</td>
      <td>${e.timeIn}</td>
      <td>${e.timeOut}</td>
      <td>${fmtBreaks(e.breaks)}</td>
      <td><span class="hours-pill ${pillClass}">${fmt(h)}</span></td>
      <td style="color:var(--text3);font-size:0.7rem;">${fmt(wkTotal)}</td>
      <td class="note-cell" title="${e.notes || ''}">${e.notes || '—'}</td>
      <td style="display:flex;gap:0.4rem;padding:0.65rem 0.5rem;">
        <button class="btn-edit" onclick="openEdit('${e.id}')">EDIT</button>
        <button class="btn btn-danger" onclick="deleteEntry('${e.id}')">DEL</button>
      </td>
    </tr>`;
  }).join('');
}

// ============================================================
// DELETE / EDIT
// ============================================================
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  let entries = loadEntries();
  entries = entries.filter(e => e.id !== id);
  saveEntries(entries);
  showToast('Entry deleted.', '');
  renderHistory();
  renderQuickWeek();
  renderOverview();
  renderPayPeriod();
}

function openEdit(id) {
  const entry = loadEntries().find(e => e.id === id);
  if (!entry) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-date').value = entry.date;
  document.getElementById('edit-in').value = entry.timeIn;
  document.getElementById('edit-out').value = entry.timeOut;
  document.getElementById('edit-notes').value = entry.notes || '';
  fillBreaks(entry.breaks, 'edit-breaks-container');
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
}

function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const date = document.getElementById('edit-date').value;
  const timeIn = document.getElementById('edit-in').value;
  const timeOut = document.getElementById('edit-out').value;
  const notes = document.getElementById('edit-notes').value.trim();
  const brks = collectBreaks('edit-breaks-container');

  if (!date || !timeIn || !timeOut) { showToast('All fields required.', 'error'); return; }

  let entries = loadEntries();
  const idx = entries.findIndex(e => e.id === id);
  if (idx === -1) return;
  entries[idx] = { id, date, timeIn, timeOut, breaks: brks, notes };
  entries.sort((a,b) => a.date.localeCompare(b.date));
  saveEntries(entries);
  closeModal();
  showToast('Entry updated ✓', 'success');
  renderHistory();
  renderQuickWeek();
  renderOverview();
  renderPayPeriod();
}

// ============================================================
// OVERVIEW CHARTS
// ============================================================
let chartDaily, chartWeekly, chartDow, chartDist;
let ovCurrentRange = 'period';

function ovQuick(type) {
  ovCurrentRange = type;
  document.querySelectorAll('#panel-overview .range-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const today = new Date();
  let from, to;

  if (type === 'week') {
    const sw = startOfWeek(today);
    from = toDateStr(sw); to = toDateStr(today);
  } else if (type === 'lastweek') {
    const lw = startOfWeek(today); lw.setDate(lw.getDate()-7);
    const le = new Date(lw); le.setDate(le.getDate()+6);
    from = toDateStr(lw); to = toDateStr(le);
  } else if (type === 'period') {
    const p = getPayPeriod(today);
    from = p.start; to = toDateStr(today);
  } else if (type === 'lastperiod') {
    const p = getPayPeriodByOffset(-1);
    from = p.start; to = p.end;
  } else if (type === 'month') {
    const m = new Date(today.getFullYear(), today.getMonth(), 1);
    from = toDateStr(m); to = toDateStr(today);
  } else {
    from = ''; to = '';
  }

  document.getElementById('ov-from').value = from;
  document.getElementById('ov-to').value = to;
  renderOverview();
}

function renderOverview() {
  const entries = loadEntries();
  const from = document.getElementById('ov-from').value;
  const to = document.getElementById('ov-to').value;

  const filtered = entries.filter(e => {
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    return true;
  });

  const totalH = filtered.reduce((a, e) => a + calcHours(e), 0);
  const days = filtered.length;
  const avgH = days > 0 ? totalH / days : 0;

  // Weekly totals
  const weekMap = {};
  filtered.forEach(e => {
    const sw = startOfWeek(new Date(e.date + 'T12:00:00'));
    const wk = toDateStr(sw);
    weekMap[wk] = (weekMap[wk] || 0) + calcHours(e);
  });
  const weekVals = Object.values(weekMap);
  const maxWeek = weekVals.length > 0 ? Math.max(...weekVals) : 0;

  // Overtime weeks
  const otWeeks = weekVals.filter(v => v > 40).length;

  // Stats
  document.getElementById('ov-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Hours</div><div class="stat-value">${totalH.toFixed(1)}</div><div class="stat-sub">${days} days logged</div></div>
    <div class="stat-card"><div class="stat-label">Avg / Day</div><div class="stat-value blue">${avgH.toFixed(2)}</div><div class="stat-sub">hours per shift</div></div>
    <div class="stat-card"><div class="stat-label">Peak Week</div><div class="stat-value orange">${maxWeek.toFixed(1)}</div><div class="stat-sub">hours in a week</div></div>
    <div class="stat-card"><div class="stat-label">OT Weeks</div><div class="stat-value ${otWeeks > 0 ? 'orange' : 'white'}">${otWeeks}</div><div class="stat-sub">weeks over 40h</div></div>
    <div class="stat-card"><div class="stat-label">Weeks Logged</div><div class="stat-value white">${Object.keys(weekMap).length}</div><div class="stat-sub">distinct weeks</div></div>
  `;

  // Overtime alert
  const thisWeekH = (() => {
    const sw = startOfWeek(new Date());
    const swStr = toDateStr(sw);
    const ew = new Date(sw); ew.setDate(ew.getDate()+6);
    const ewStr = toDateStr(ew);
    return entries.filter(e => e.date >= swStr && e.date <= ewStr).reduce((a,e) => a + calcHours(e), 0);
  })();
  document.getElementById('overtime-alert').innerHTML = thisWeekH > 40
    ? `<div class="overtime-alert"><span class="alert-icon">⚠</span><span>You've worked <strong>${fmt(thisWeekH)}</strong> this week — ${fmt(thisWeekH - 40)} over 40h</span></div>`
    : '';

  // Chart colors
  const C = {
    accent: 'rgba(232,255,0,0.85)',
    accent2: 'rgba(255,107,53,0.85)',
    accent3: 'rgba(0,212,255,0.7)',
    grid: 'rgba(255,255,255,0.05)',
    text: '#888888',
  };

  const baseOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { color: C.grid }, ticks: { color: C.text, font: { family: "'IBM Plex Mono'" , size: 10 } } },
      y: { grid: { color: C.grid }, ticks: { color: C.text, font: { family: "'IBM Plex Mono'", size: 10 } } }
    }
  };

  // Daily chart
  if (chartDaily) chartDaily.destroy();
  const dailyLabels = filtered.map(e => formatDateShort(e.date));
  const dailyData = filtered.map(e => calcHours(e));
  const dailyColors = dailyData.map(h => h > 10 ? C.accent2 : C.accent);
  chartDaily = new Chart(document.getElementById('chart-daily'), {
    type: 'bar',
    data: {
      labels: dailyLabels,
      datasets: [{ data: dailyData, backgroundColor: dailyColors, borderWidth: 0, barPercentage: 0.6 }]
    },
    options: { ...baseOpts }
  });

  // Weekly chart
  if (chartWeekly) chartWeekly.destroy();
  const weekKeys = Object.keys(weekMap).sort();
  chartWeekly = new Chart(document.getElementById('chart-weekly'), {
    type: 'bar',
    data: {
      labels: weekKeys.map(k => formatDateShort(k)),
      datasets: [{
        data: weekKeys.map(k => weekMap[k]),
        backgroundColor: weekKeys.map(k => weekMap[k] > 40 ? C.accent2 : C.accent3),
        borderWidth: 0, barPercentage: 0.6
      }]
    },
    options: { ...baseOpts }
  });

  // Day of week average
  if (chartDow) chartDow.destroy();
  const dowTotals = [0,0,0,0,0,0,0];
  const dowCounts = [0,0,0,0,0,0,0];
  filtered.forEach(e => {
    const d = new Date(e.date + 'T12:00:00').getDay();
    dowTotals[d] += calcHours(e);
    dowCounts[d]++;
  });
  const dowAvg = dowTotals.map((t, i) => dowCounts[i] > 0 ? t / dowCounts[i] : 0);
  chartDow = new Chart(document.getElementById('chart-dow'), {
    type: 'bar',
    data: {
      labels: DAYS,
      datasets: [{ data: dowAvg, backgroundColor: C.accent, borderWidth: 0, barPercentage: 0.6 }]
    },
    options: { ...baseOpts }
  });

  // Hours distribution
  if (chartDist) chartDist.destroy();
  const buckets = { '<6h': 0, '6–8h': 0, '8–10h': 0, '10–12h': 0, '>12h': 0 };
  filtered.forEach(e => {
    const h = calcHours(e);
    if (h < 6) buckets['<6h']++;
    else if (h < 8) buckets['6–8h']++;
    else if (h < 10) buckets['8–10h']++;
    else if (h < 12) buckets['10–12h']++;
    else buckets['>12h']++;
  });
  chartDist = new Chart(document.getElementById('chart-dist'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(buckets),
      datasets: [{
        data: Object.values(buckets),
        backgroundColor: ['#2a2a2a', C.accent, C.accent3, C.accent2, '#ff4444'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { color: '#888', font: { family: "'IBM Plex Mono'", size: 10 }, padding: 12 } }
      }
    }
  });
}

// ============================================================
// PAY PERIOD
// ============================================================
let ppOffset = 0;
let chartPP;

function navPeriod(dir) { ppOffset += dir; renderPayPeriod(); }
function goCurrentPeriod() { ppOffset = 0; renderPayPeriod(); }

function renderPayPeriod() {
  const period = getPayPeriodByOffset(ppOffset);
  const entries = loadEntries().filter(e => e.date >= period.start && e.date <= period.end);

  document.getElementById('period-label').textContent =
    formatDateDisplay(period.start) + '  →  ' + formatDateDisplay(period.end);

  const totalH = entries.reduce((a, e) => a + calcHours(e), 0);
  const days = entries.length;

  // Split into 2 weeks
  const w1Start = period.start;
  const w1End = (() => { const d = new Date(period.start + 'T12:00:00'); d.setDate(d.getDate()+6); return toDateStr(d); })();
  const w2Start = (() => { const d = new Date(period.start + 'T12:00:00'); d.setDate(d.getDate()+7); return toDateStr(d); })();
  const w2End = period.end;

  const w1Entries = entries.filter(e => e.date >= w1Start && e.date <= w1End);
  const w2Entries = entries.filter(e => e.date >= w2Start && e.date <= w2End);
  const w1H = w1Entries.reduce((a,e) => a+calcHours(e),0);
  const w2H = w2Entries.reduce((a,e) => a+calcHours(e),0);

  document.getElementById('pp-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Period Total</div><div class="stat-value">${totalH.toFixed(1)}</div><div class="stat-sub">${days} days worked</div></div>
    <div class="stat-card"><div class="stat-label">Week 1</div><div class="stat-value blue">${w1H.toFixed(1)}</div><div class="stat-sub">${w1Entries.length} days</div></div>
    <div class="stat-card"><div class="stat-label">Week 2</div><div class="stat-value blue">${w2H.toFixed(1)}</div><div class="stat-sub">${w2Entries.length} days</div></div>
    <div class="stat-card"><div class="stat-label">OT Hours</div><div class="stat-value ${totalH > 80 ? 'orange' : 'white'}">${Math.max(0, totalH-80).toFixed(1)}</div><div class="stat-sub">over 80h period</div></div>
  `;

  document.getElementById('pp-overtime-alert').innerHTML = w1H > 40 || w2H > 40
    ? `<div class="overtime-alert"><span class="alert-icon">⚠</span><span>${w1H > 40 ? 'Week 1: ' + fmt(w1H-40) + ' over 40h  ' : ''}${w2H > 40 ? 'Week 2: ' + fmt(w2H-40) + ' over 40h' : ''}</span></div>`
    : '';

  function renderWeekBlock(weekEntries, startDate) {
    const sw = new Date(startDate + 'T12:00:00');
    const rows = [];
    const maxH = Math.max(...weekEntries.map(e => calcHours(e)), 1);
    for (let i = 0; i < 7; i++) {
      const d = new Date(sw); d.setDate(d.getDate() + i);
      const ds = toDateStr(d);
      const entry = weekEntries.find(e => e.date === ds);
      const h = entry ? calcHours(entry) : 0;
      const pct = Math.min(100, (h / 12) * 100);
      rows.push(`<div class="day-bar-wrapper">
        <div class="day-bar-label">${DAYS[d.getDay()]}</div>
        <div class="day-bar-track"><div class="day-bar-fill${h > 10 ? ' overtime' : ''}" style="width:${pct}%"></div></div>
        <div class="day-bar-val">${h > 0 ? fmt(h) : '—'}</div>
      </div>`);
    }
    return rows.join('');
  }

  document.getElementById('pp-week1').innerHTML = renderWeekBlock(w1Entries, w1Start);
  document.getElementById('pp-week2').innerHTML = renderWeekBlock(w2Entries, w2Start);

  // PP Chart
  if (chartPP) chartPP.destroy();
  const ppDates = [];
  const ppData = [];
  const ppColors = [];
  const ppStart = new Date(period.start + 'T12:00:00');
  for (let i = 0; i < 14; i++) {
    const d = new Date(ppStart); d.setDate(d.getDate() + i);
    const ds = toDateStr(d);
    const entry = entries.find(e => e.date === ds);
    const h = entry ? calcHours(entry) : 0;
    ppDates.push(DAYS[d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate());
    ppData.push(h);
    ppColors.push(h > 10 ? 'rgba(255,107,53,0.85)' : h > 0 ? 'rgba(232,255,0,0.85)' : 'rgba(42,42,42,0.5)');
  }

  chartPP = new Chart(document.getElementById('chart-pp'), {
    type: 'bar',
    data: {
      labels: ppDates,
      datasets: [{ data: ppData, backgroundColor: ppColors, borderWidth: 0, barPercentage: 0.65 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#666', font: { family: "'IBM Plex Mono'", size: 9 } } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#666', font: { family: "'IBM Plex Mono'", size: 10 } } }
      }
    }
  });
}

// ============================================================
// TABS
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'overview') renderOverview();
  if (name === 'payperiod') renderPayPeriod();
  if (name === 'history') renderHistory();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'success' ? ' success' : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
